[project]
name = "eeg-speech"
version = "0.1.0"
description = "EEG imagined speech decoding — personal BCI research pipeline"
requires-python = ">=3.11"
dependencies = [
    # EEG signal processing core
    "mne>=1.8.0",
    # Data loading
    "mat73>=0.60",
    "h5py>=3.10",
    # Preprocessing
    "pyprep>=0.4.3",
    "mne-icalabel>=0.6",
    "autoreject>=0.4.3",
    # ML baseline
    "scikit-learn>=1.3",
    # Deep learning
    "torch>=2.1",
    "braindecode>=0.8",
    # Wavelet features
    "PyWavelets>=1.4",
    # Data/viz
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # Audio export (side quest)
    "soundfile>=0.12",
    # Experiment tracking
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.0",
    "jupyter>=1.0",
    "jupyterlab>=4.0",
    "ruff>=0.4",
]

[tool.uv]
# Intel Mac (x86_64): PyTorch dropped these wheels after 2.2.x; use pytorch's CPU index
override-dependencies = [
    # Intel Mac: PyTorch dropped x86_64 wheels after 2.2.x; braindecode>=0.8.2 added torchaudio dep which has same problem
    "torch==2.2.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "braindecode==0.8.1 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # torch 2.2.2 was compiled against NumPy 1.x; NumPy 2.x breaks torch.from_numpy()
    "numpy<2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin' and platform_machine == 'x86_64'" },
]

[tool.ruff]
line-length = 100
target-version = "py311"
